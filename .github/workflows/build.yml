name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Jellyfin 12 is the oldest supported server and what we ship against.
          - label: "Jellyfin 12.0 (net10.0)"
            jellyfin: "12.0.0"
          # Newer Jellyfin is compiled as well, so an API change that would break
          # the single shipped build shows up here rather than in the wild.
          - label: "Jellyfin 12.1 (net10.0)"
            jellyfin: "12.1.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # No --no-restore: each variant restores its own Jellyfin package versions.
      - name: Build
        run: dotnet build --configuration Release -p:JellyfinVersion=${{ matrix.jellyfin }}
